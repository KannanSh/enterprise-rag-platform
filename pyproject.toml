[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Enterprise RAG reference platform with pgvector, provider abstraction, RBAC, audit and evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.21,<1",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "boto3>=1.35,<2",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
